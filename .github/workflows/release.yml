name: Release

# Push a tag like v0.1.0: tests run, the zip is built by tools/package.ps1, and a GitHub release is published with it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          $v = $env:TAG.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Tag $env:TAG is not vMAJOR.MINOR.PATCH" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($v -match '-') { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: .NET tests
        run: dotnet test DeviceDeck.slnx -c Release -nologo

      - name: Web tests
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Package win-x64
        id: package
        shell: pwsh
        run: ./tools/package.ps1 -Version ${{ steps.version.outputs.version }} -Runtime win-x64

      - name: SHA-256
        id: hash
        shell: pwsh
        run: |
          $zip = "${{ steps.package.outputs.zip }}"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content "$zip.sha256" -Encoding ascii
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "${{ steps.package.outputs.zip }}"
          $notes = "docs/releases/$env:TAG.md"
          $ghArgs = @($env:TAG, $zip, "$zip.sha256", '--title', "DeviceDeck $env:TAG", '--verify-tag')
          if (Test-Path $notes) { $ghArgs += @('--notes-file', $notes) } else { $ghArgs += '--generate-notes' }
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $ghArgs += '--prerelease' }
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $zip "$zip.sha256" --clobber
          } else {
            gh release create @ghArgs
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed" }
