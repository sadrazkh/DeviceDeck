name: Release

# Push a tag like v0.2.0: tests run once, then x64 and ARM64 are each built into a portable zip and a Velopack
# installer (with the update packages the installed app reads from GitHub Releases), and one GitHub release is
# published with all of it. Signing runs only when its secrets are set (see docs/code-signing.md); otherwise
# everything is unsigned, as before.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.2.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  VPK_VERSION: 1.2.161
  ARTIFACT_SIGNING_CLIENT: 1.0.128

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          $v = $env:TAG.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Tag $env:TAG is not vMAJOR.MINOR.PATCH" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($v -match '-') { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: .NET tests
        run: dotnet test DeviceDeck.slnx -c Release -nologo

      - name: Web tests
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test

  package:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        runtime: [win-x64, win-arm64]
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Velopack CLI
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      - name: Last release, for delta updates
        # Nothing to diff against on the first installer release; vpk then makes a full package only.
        continue-on-error: true
        shell: pwsh
        run: vpk download github --repoUrl "https://github.com/${{ github.repository }}" --channel ${{ matrix.runtime }} --outputDir "artifacts/velopack/${{ matrix.runtime }}" --token "${{ github.token }}"

      - name: Signing (only when a certificate is configured)
        id: sign
        shell: pwsh
        env:
          # Microsoft Artifact Signing (formerly Azure Trusted Signing): an app registration's secret plus the account's details.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          # Or a code-signing certificate as a .pfx (base64) and its password.
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $timestamp = '/tr http://timestamp.digicert.com /td SHA256'
          if ($env:AZURE_CLIENT_SECRET -and $env:SIGNING_ENDPOINT -and $env:SIGNING_ACCOUNT -and $env:SIGNING_PROFILE) {
            $client = Join-Path $env:RUNNER_TEMP 'artifact-signing'
            Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.ArtifactSigning.Client/$env:ARTIFACT_SIGNING_CLIENT" -OutFile "$client.zip"
            Expand-Archive "$client.zip" $client -Force
            $metadata = Join-Path $env:RUNNER_TEMP 'artifact-signing.json'
            @{ Endpoint = $env:SIGNING_ENDPOINT; CodeSigningAccountName = $env:SIGNING_ACCOUNT; CertificateProfileName = $env:SIGNING_PROFILE } |
              ConvertTo-Json | Set-Content $metadata -Encoding utf8
            $template = "`"$($signtool.FullName)`" sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib `"$client\bin\x64\Azure.CodeSigning.Dlib.dll`" /dmdf `"$metadata`" {{file}}"
            Write-Host 'Signing with Microsoft Artifact Signing.'
          } elseif ($env:SIGNING_PFX_BASE64) {
            # Into the runner's certificate store, so the password never appears on the command line vpk runs
            # through cmd (where & % ^ or " in a password would break it); signtool finds it by thumbprint.
            $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]'UserKeySet, PersistKeySet'
            $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:SIGNING_PFX_PASSWORD, $flags)
            $store = [Security.Cryptography.X509Certificates.X509Store]::new('My', 'CurrentUser')
            $store.Open('ReadWrite')
            $store.Add($certificate)
            $store.Close()
            Remove-Item $pfx
            $template = "`"$($signtool.FullName)`" sign /fd SHA256 $timestamp /s My /sha1 $($certificate.Thumbprint) {{file}}"
            Write-Host 'Signing with the PFX certificate.'
          } else {
            $template = ''
            Write-Host 'No signing secrets are set: this build is unsigned.'
          }
          # A file, not a step output: the template's quotes reach the next step as they are.
          $file = Join-Path $env:RUNNER_TEMP 'sign-template.txt'
          Set-Content $file $template -NoNewline -Encoding utf8
          "templateFile=$file" >> $env:GITHUB_OUTPUT

      - name: Package ${{ matrix.runtime }} (zip and installer)
        id: package
        shell: pwsh
        env:
          # The Azure credentials again, for the signing client that vpk and signtool load.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $template = Get-Content -Raw "${{ steps.sign.outputs.templateFile }}"
          ./tools/package.ps1 -Version $env:VERSION -Runtime ${{ matrix.runtime }} -Installer -SignTemplate "$template"

      - name: SHA-256
        shell: pwsh
        run: |
          foreach ($file in @("${{ steps.package.outputs.zip }}", "${{ steps.package.outputs.installer }}")) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $file -Leaf)" | Set-Content "$file.sha256" -Encoding ascii
          }

      - name: Collect what this release ships
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force "release/${{ matrix.runtime }}"
          Copy-Item "${{ steps.package.outputs.zip }}", "${{ steps.package.outputs.zip }}.sha256", "${{ steps.package.outputs.installer }}", "${{ steps.package.outputs.installer }}.sha256" $out
          # This version's update packages and the channel's feed; older packages downloaded for deltas stay behind.
          Get-ChildItem "${{ steps.package.outputs.velopack }}" -File |
            Where-Object { $_.Name -like "*-$env:VERSION-*.nupkg" -or $_.Name -like 'releases.*.json' -or $_.Name -like 'assets.*.json' -or $_.Name -like 'RELEASES*' } |
            Copy-Item -Destination $out
          Get-ChildItem $out | ForEach-Object { Write-Host "  $($_.Name)" }

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runtime }}
          path: release/${{ matrix.runtime }}
          if-no-files-found: error

  publish:
    needs: [test, package]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem release -File | ForEach-Object { $_.FullName }
          $files | ForEach-Object { Write-Host "  $(Split-Path $_ -Leaf)" }
          $notes = "docs/releases/$env:TAG.md"
          $ghArgs = @($env:TAG) + $files + @('--title', "DeviceDeck $env:TAG", '--verify-tag')
          if (Test-Path $notes) { $ghArgs += @('--notes-file', $notes) } else { $ghArgs += '--generate-notes' }
          if ('${{ needs.test.outputs.prerelease }}' -eq 'true') { $ghArgs += '--prerelease' }
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
          } else {
            gh release create @ghArgs
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed" }
